[build]
  command = "python3 build_netlify.py"
  publish = "dist"

[[redirects]]
  from = "/"
  to = "/ai-tools.html"
  status = 200
  force = true

[[redirects]]
  from = "/ai-tools/elevenlabs-vs-kokoro-tts-2026.html"
  to = "/ai-tools/tts-commercial-use-checklist.html"
  status = 302

[[redirects]]
  from = "/go/voice-01/tt"
  to = "/ai-tools/elevenlabs-first-voiceover.html?utm_source=tiktok&utm_medium=organic_social&utm_campaign=elevenlabs_voiceover_01"
  status = 302
  force = true

[[redirects]]
  from = "/go/voice-01/ig"
  to = "/ai-tools/elevenlabs-first-voiceover.html?utm_source=instagram&utm_medium=organic_social&utm_campaign=elevenlabs_voiceover_01"
  status = 302
  force = true

[[redirects]]
  from = "/go/voice-01/yt"
  to = "/ai-tools/elevenlabs-first-voiceover.html?utm_source=youtube&utm_medium=organic_social&utm_campaign=elevenlabs_voiceover_01"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/ai-tools/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
