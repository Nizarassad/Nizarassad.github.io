name: Render Flagship 01 Proof

on:
  push:
    branches: [main]
    paths:
      - "video/**"
      - ".github/workflows/render-flagship-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flagship-01-proof
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: video

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: video/package.json

      - name: Install media verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Run static quality gate
        run: npm run check

      - name: Render low-resolution visual-only proof
        run: npm run render:proof

      - name: Verify media contract
        id: media_qc
        run: node scripts/verify-media.mjs out/flagship-01-proof.mp4

      - name: Upload private review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagship-01-visual-proof
          path: |
            video/out/flagship-01-proof.mp4
            video/out/SHA256SUMS.txt
            video/out/media.json
            video/out/sources.json
          if-no-files-found: error
          retention-days: 14
